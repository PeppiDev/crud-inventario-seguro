sonar.projectKey=crud-inventario
sonar.projectName=CRUD Inventario
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py
# Exclusiones técnicas: entorno virtual, estáticos recolectados, migraciones autogeneradas y la base de datos local.
# No se excluye código propio de la aplicación.
sonar.exclusions=.venv/**,staticfiles/**,**/migrations/**,db.sqlite3,uv.lock
