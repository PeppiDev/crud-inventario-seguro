<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventario{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #eee; }
    .btn { display: inline-block; padding: .4rem .8rem; background: #2563eb; color: #fff; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 1rem; }
    .btn-peligro { background: #dc2626; }
    .btn-link { background: none; color: #2563eb; padding: 0; }
    .mensaje { padding: .6rem; background: #dcfce7; border-radius: 4px; }
    .errorlist { color: #dc2626; margin: .2rem 0; padding-left: 1rem; }
    form p { margin: .8rem 0; }
    label { display: block; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'inventario:lista' %}" style="color:inherit;text-decoration:none">Inventario</a></h1>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ user.username }} · <button type="submit" class="btn btn-link">Cerrar sesión</button>
      </form>
    {% endif %}
  </header>
  {% for message in messages %}<p class="mensaje">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
