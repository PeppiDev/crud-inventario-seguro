{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventario{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header>
    <h1><a href="{% url 'inventario:lista' %}">Inventario</a></h1>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ user.username }} · <button type="submit" class="btn btn-link">Cerrar sesión</button>
      </form>
    {% endif %}
  </header>
  {% for message in messages %}<p class="mensaje">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
