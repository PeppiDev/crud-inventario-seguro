{% extends "base.html" %}
{% block content %}
<h2>{% if object %}Editar {{ object.nombre }}{% else %}Nuevo producto{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Guardar</button>
  <a href="{% url 'inventario:lista' %}">Cancelar</a>
</form>
{% endblock %}
