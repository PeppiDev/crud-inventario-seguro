{% extends "base.html" %}
{% block content %}
<h2>Eliminar producto</h2>
<p>¿Seguro que quieres eliminar <strong>{{ object.nombre }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-peligro">Eliminar</button>
  <a href="{% url 'inventario:lista' %}">Cancelar</a>
</form>
{% endblock %}
